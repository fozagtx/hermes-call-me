name: hermes-call-me
version: "0.2.0"
manifest_version: 2
api_version: 1
description: >
  Phones the owner through CALL-E for approval, help, or a progress report.
  A spoken PIN, checked by the plugin, gates every answer. Fails closed.
author: fozagtx
license: MIT
requires_hermes: ">=0.21.6"
tags: [voice, phone, calle, approval, human-in-the-loop]
provides_tools:
  - call_for_approval
  - call_for_help
  - call_report
provides_hooks:
  - pre_tool_call
config_schema:
  calle_api_key:
    type: secret
    env: CALLE_API_KEY
    label: CALL-E API key
    description: "Private key from the CALL-E dashboard (https://dashboard.heycall-e.com/account/api-keys)."
  owner_pin:
    type: secret
    env: HERMES_CALL_ME_PIN
    label: Owner PIN
    description: "4 to 12 digits. The call asks for it first and the plugin compares it. Wrong, missing, or unclear means not approved."
  owner_number:
    type: str
    default: ""
    label: Owner number
    description: "The one number the plugin may dial, in E.164 with + and the country code."
  calle_region:
    type: str
    default: US
    label: CALL-E region
    description: "Two-letter destination country. Must match the owner number. See https://docs.heycall-e.com/regions."
  calle_locale:
    type: str
    default: en-US
    label: CALL-E locale
    description: "Spoken language, such as en-US."
  call_timeout_seconds:
    type: int
    default: 180
    label: Call timeout seconds
    description: "How long to wait for the call's result before returning no_answer. 30 to 600."
  daily_call_cap:
    type: int
    default: 8
    label: Daily call cap
    description: "Maximum calls CALL-E accepts in a rolling 24 hours."
  quiet_hours:
    type: str
    default: "22:00-07:00"
    label: Quiet hours
    description: "Local window when calls are refused, if quiet hours are enabled. Overnight ranges are allowed."
  quiet_hours_enabled:
    type: bool
    default: false
    label: Quiet hours enabled
    description: "Turn on to refuse calls during quiet hours."
  owner_timezone:
    type: str
    default: "America/New_York"
    label: Owner timezone
    description: "IANA timezone for quiet hours."
  guard_enabled:
    type: bool
    default: false
    label: Risky-tool guard
    description: "When on, pre_tool_call blocks tools whose names match the risky patterns until call_for_approval returns approved."
  risky_tool_patterns:
    type: list
    default: []
    label: Risky tool patterns
    description: "Regular expressions matched against tool names. Empty uses the built-in deploy/delete/payment list."
  approval_ttl_seconds:
    type: int
    default: 600
    label: Approval lifetime
    description: "How long an approval can be spent on the matching risky tool. Single use."
